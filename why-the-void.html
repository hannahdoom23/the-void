    <h1>[Why the Void]</h1>
    <p class="byline">By Hannah Doom &middot; [August 2026]</p>

    <div class="article-body">
      <p>I’ve wanted a place to put my thoughts into the world for a long time. I’ve tried before–lots of times. A half-empty journal, an abandoned essay, a partly created website. It never quite stuck. There was always a reason to put it off: not enough time, not enough to say, not the right moment.</p>
      <p>Eventually, I got a job unrelated to my degree. I fell in love with the world I had joined, and neglected the world that raised me. I realized that if I wanted to take writing seriously, I needed more than bad excuses and good intentions. I needed to stop worrying about what could happen, what couldn’t happen, or who might stumble across it. I needed my own personal place to scream into the void of the internet without a second thought.</p>
      <p>So that’s what The Void is. Not a portfolio built to impress employers or friends, but an honest collection of what I think about and care about. Things that keep me up at night, the faith that shapes how I see the world, lessons I learn, and news and culture I can’t help but have opinions on. Some of it will be serious, some of it won’t. All of it will be true to who I am and what I believe.</p>
    </p>If anyone manages to somehow stumble across this, welcome. I hope you find something here that’s worth your time.<p>
    </p>
